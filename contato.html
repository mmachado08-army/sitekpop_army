<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Contato - K-Pop World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📩 Entre em Contato</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="playlist.html">Playlist</a>
            <a href="moda.html">Moda</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>💜 Fale conosco!</h2>

            <p>
                Gostou do K-Pop World? Tem alguma sugestão,
                dúvida ou quer indicar uma música?
            </p>

            <p>
                Preencha o formulário abaixo e deixe sua mensagem.
            </p>
        </section>

        <section>

            <h2>📝 Formulário de contato</h2>

            <form>

                <label for="nome">Nome:</label>
                <br>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                <br><br>

                <label for="email">E-mail:</label>
                <br>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
                <br><br>

                <label for="assunto">Assunto:</label>
                <br>
                <select id="assunto" name="assunto">
                    <option value="">Selecione uma opção</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="duvida">Dúvida</option>
                    <option value="musica">Indicação de música</option>
                    <option value="outro">Outro</option>
                </select>
                <br><br>

                <label for="mensagem">Mensagem:</label>
                <br>
                <textarea id="mensagem" name="mensagem" rows="6" cols="40"
                    placeholder="Escreva sua mensagem"></textarea>
                <br><br>

                <button type="submit">Enviar 💜</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Site desenvolvido por Maria - Equipe 2 💜</p>
    </footer>

</body>

</html>
